name: Daily Stock News Auto Update

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行 AI 自动更新脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python update_news.py

      - name: 自动提交更改到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git diff-index --quiet HEAD || git commit -m "Auto update daily financial news"
          git push
