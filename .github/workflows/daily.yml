name: 每日自动更新 Stock-Today 理财早报

on:
  schedule:
    # 每天北京时间早上 7:00 自动运行 (对应 UTC 时间 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 支持在 GitHub 手动点击立即运行

permissions:
  contents: write # 赋予 Actions 写入仓库提交权限

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 安装依赖并运行更新脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openai
          python update_news.py

      - name: 提交并推送更新到仓库
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "🤖 自动更新每日理财早报资讯 [$(date +'%Y-%m-%d')]"
          git push
