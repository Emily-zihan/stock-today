name: 每日自动更新 Stock-Today 理财早报

on:
  schedule:
    # 每天北京时间早上 7:00 自动运行 (UTC 时间 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 同时也支持在 GitHub 手动点击立即运行

permissions:
  contents: write # 显式赋予仓库写入权限

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3[cite: 7]

      - name: 配置 Python 环境
        uses: actions/setup-python@v4[cite: 7]
        with:
          python-version: '3.x'[cite: 7]

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip[cite: 7]
          pip install requests beautifulsoup4 openai

      - name: 运行更新脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python update_news.py[cite: 7]

      - name: 提交并推送更新到仓库
        run: |
          git config --global user.name "GitHub Action"[cite: 7]
          git config --global user.email "action@github.com"[cite: 7]
          git add .[cite: 7]
          git diff-index --quiet HEAD || git commit -m "🤖 自动更新每日理财早报资讯 [$(date +'%Y-%m-%d')]"[cite: 7]
          git push[cite: 7]
