<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>stock-today</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 16px;
      padding-bottom: 40px;
    }
    
    /* 1. 顶部高级感问候横幅 */
    .header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: white;
      padding: 24px 20px;
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.2);
    }
    .header h1 { font-size: 28px; margin-bottom: 6px; font-weight: 700; letter-spacing: -0.5px; }
    .header p { font-size: 16px; opacity: 0.85; }

    /* 通用卡片容器 */
    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #f1f5f9;
    }

    /* 2. 隔夜全球大盘网格 */
    .market-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .market-item {
      background: #f8fafc;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .market-name { font-size: 15px; color: #64748b; font-weight: 500; }
    .market-val { font-size: 24px; font-weight: 800; margin: 6px 0 2px 0; }
    
    /* A股红涨绿跌 */
    .up { color: #ef4444; } 
    .down { color: #22c55e; }

    /* 3. 新闻解读列表 */
    .news-list { list-style: none; }
    .news-item {
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px dashed #e2e8f0;
      color: #334155;
    }
    .news-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    
    /* 4. 股票/新股关注列表 */
    .stock-list { list-style: none; }
    .stock-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .stock-item:last-child { margin-bottom: 0; }
    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .stock-name { font-size: 19px; font-weight: bold; color: #0f172a; }
    .stock-code { font-size: 14px; color: #64748b; font-weight: normal; margin-left: 6px; }
