<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stock-Today 每日智能理财早报</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f5f9;
      color: #0f172a;
      padding: 16px;
      padding-bottom: 70px;
    }
    
    .header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: white;
      padding: 24px 20px;
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .header p { font-size: 15px; opacity: 0.8; margin-top: 4px; }
    .brand-logo { font-size: 14px; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 10px; font-weight: bold; }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    }
    .card-title {
      font-size: 19px;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #f1f5f9;
    }

    .market-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .market-item {
      background: #f8fafc;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .market-name { font-size: 14px; color: #64748b; font-weight: 500; }
    .market-val { font-size: 22px; font-weight: 800; margin: 6px 0 2px 0; }
    .up { color: #ef4444; } 
    .down { color: #22c55e; }

    .news-list { list-style: none; }
    .news-item {
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px dashed #e2e8f0;
      color: #334155;
    }
    .news-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .news-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    
    .btn-action {
      background: #eff6ff;
      color: #2563eb;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      margin-left: 8px;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      display: inline-block;
    }
    .badge-red { background: #fee2e2; color: #dc2626; }
    .badge-blue { background: #e0f2fe; color: #0284c7; }
    .badge-orange { background: #ffedd5; color: #c2410c; }

    .stock-list { list-style: none; }
    .stock-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .stock-item:last-child { margin-bottom: 0; }
    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .stock-name { font-size: 19px; font-weight: bold; color: #0f172a; }
    .stock-code { font-size: 14px; color: #64748b; margin-left: 6px; }
    .stock-desc { font-size: 15px; color: #475569; line-height: 1.5; margin-bottom: 12px; }
    
    /* 单个完整大按钮样式 */
    .btn-block {
      width: 100%;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      padding: 10px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-block:active { background: #dbeafe; }

    /* 关联资讯列表 */
    .related-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }
    .related-title { font-size: 14px; font-weight: bold; color: #1e293b; margin-bottom: 8px; }
    .related-link {
      display: block;
      font-size: 14px;
      color: #2563eb;
      text-decoration: none;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .source-tag { font-size: 11px; background: #e2e8f0; color: #475569; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }

    /* 弹窗样式 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
